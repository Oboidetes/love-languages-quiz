<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пять языков любви. Опросник</title>
<style>
:root{--bg:#f3f5f6;--fg:#1b2428;--mut:#5d6b70;--card:#fff;--bd:#cfd8db;--ac:#2f6f73;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--fg:#e6eef0;--mut:#9fb0b5;--card:#1d2528;--bd:#3a474b;--ac:#6fb3b7;--on:#10181a}}
:root[data-theme="dark"]{--bg:#14191b;--fg:#e6eef0;--mut:#9fb0b5;--card:#1d2528;--bd:#3a474b;--ac:#6fb3b7;--on:#10181a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;line-height:1.3}
h2{font-size:1.3rem;margin:.4em 0}
.m{color:var(--mut);font-size:.9rem;margin:.4em 0}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--bd)}
.row>span:first-child{flex:1}
.c{display:flex;align-items:center;gap:8px}
.c b{min-width:1.6em;text-align:center}
button{font:inherit;min-height:44px;min-width:44px;padding:0 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;margin:12px 0}
.card p{margin:.5em 0 0}
.bar{height:8px;background:var(--bd);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
textarea{width:100%;box-sizing:border-box;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
</style>
</head>
<body>
<main><div id="a"></div></main>
<script>
const L=['Слова поддержки','Качественное время','Подарки','Помощь и забота','Прикосновения'];
const D=[
'Вы чувствуете, что вас любят, когда это сказано: комплимент, благодарность, поддержка, слова о том, что вас ценят и в вас верят. Это может быть сказано вслух или написано. По Чэпмену, для таких людей особенно ранят резкие слова и молчание там, где ждёшь тёплого отклика.',
'Вам важно, когда партнёр по-настоящему с вами: слушает, не отвлекаясь, или занимается с вами чем-то общим. Дело не в количестве часов, а в ощущении, что в этот момент вы для него главное. Привычка делать «параллельные» дела, находясь рядом, может восприниматься как отсутствие.',
'Для вас ценен знак внимания: человек вспомнил о вас и выбрал для вас что-то. Это может быть мелочь, цветы, что-то вкусное или вещь, которую вы давно хотели. Важнее всего то, что за подарком видно внимание, а не цена.',
'Вы чувствуете любовь, когда партнёр делает что-то для вас: облегчает дела, замечает, что вам тяжело, выполняет то, о чём вы просили. Невыполненные обещания и безразличие к вашей нагрузке ранят сильнее, чем у других людей, у которых главный язык иной.',
'Для вас важен физический контакт: объятия, касания, держание за руку, близость, в том числе сексуальная. Физическое присутствие партнёра воспринимается как проявление любви, а его отсутствие как холодность.'];
// порядок утверждений в каждом вопросе: Слова, Время, Подарки, Помощь, Прикосновения
const Q=[
['Вы вернулись домой после тяжёлого дня. Что сильнее всего даст вам ощущение, что вас любят?',['Партнёр говорит, что гордится тем, как вы со всем справляетесь.','Партнёр откладывает свои дела и садится рядом выслушать, как прошёл ваш день.','Партнёр приносит вещь, которую вы давно хотели, и ничего не объясняет.','Партнёр уже приготовил ужин и разобрал то, что вы не успели.','Партнёр обнимает вас, как только вы входите в дом.']],
['Обычная неделя, ничего особенного не происходит. Что сильнее всего даст вам почувствовать, что вы важны партнёру?',['Он сам, без повода, говорит, за что вас ценит.','Он находит вечер, который вы проводите вместе за общим занятием.','Он дарит вам что-то, подобранное именно под вас, а не «что попалось».','Он без просьбы закрывает дело, которое вы не любите делать.','Вы проводите вечер в физической близости, которую выбрали оба.']],
['Вы переживаете перед важным событием (экзамен, собеседование, выступление). Что поддержит вас сильнее всего?',['Партнёр говорит, что верит в вас, и объясняет почему.','Партнёр проводит вечер накануне рядом с вами.','Партнёр вручает вам небольшой талисман «на удачу».','Партнёр освобождает вас от бытовых дел, чтобы вы спокойно подготовились.','Партнёр делает вам массаж, чтобы вы расслабились.']],
['Последние недели вы с партнёром заметно отдалились. Что из прежнего вам больше всего хотелось бы вернуть?',['Он раньше чаще говорил вам, что вы для него значите.','Вы раньше чаще проводили время вдвоём за общими делами.','Он раньше чаще дарил вам что-то, из чего было видно, что он думал о вас.','Он раньше чаще помогал вам сам, не дожидаясь просьбы.','Вы раньше чаще были физически близки.']],
['После ссоры эмоции улеглись. Что быстрее всего вернёт вам ощущение, что всё в порядке?',['Партнёр прямо говорит, что любит вас и ценит.','Партнёр предлагает выбраться куда-нибудь вдвоём, как раньше.','Партнёр выбирает для вас подарок, который подходит именно вам.','Партнёр делает то, о чём вы давно просили.','Партнёр подходит и обнимает вас.']],
['Приближается ваш день рождения. Что сильнее всего даст вам почувствовать, что вас любят?',['Партнёр пишет вам письмо о том, чем вы ему дороги.','Партнёр освобождает весь день, чтобы провести его с вами.','Партнёр выбирает подарок, о котором вы когда-то обмолвились.','Партнёр сам готовит праздник, вам не нужно ни во что вникать.','Партнёр весь вечер обнимает вас и держит за руку.']],
['Вы простудились и несколько дней лежите дома. Что поддержит вас сильнее всего?',['Партнёр подбадривает вас тёплыми словами и пишет вам в течение дня.','Партнёр сидит рядом и смотрит с вами фильм.','Партнёр приносит ваше любимое лакомство и свежую книгу.','Партнёр занимается покупками, готовкой и уборкой.','Партнёр гладит вас по голове и укрывает одеялом.']],
['У вас случилось что-то хорошее: повышение, завершённый проект, важная победа. Как партнёр порадует вас сильнее всего?',['Говорит, что всегда знал, что у вас получится, и рад за вас.','Устраивает вечер вдвоём, чтобы отметить это вместе.','Дарит вам памятную вещь в честь этого события.','Закрывает ваши текущие дела, чтобы вы смогли отдохнуть.','Крепко обнимает вас и целует.']],
['Несколько недель вы оба очень заняты и почти не пересекаетесь. Чего вам в эти недели не хватает сильнее всего?',['Слов о том, что партнёр вас ценит.','Общих вечеров, когда вы вдвоём занимаетесь чем-то своим.','Небольших сюрпризов, ради которых он что-то для вас выбирал.','Помощи в делах, когда вы не успеваете.','Близости и касаний хотя бы на несколько минут.']],
['Партнёр уезжает на неделю. Чего вам будет не хватать больше всего?',['Его утренних и вечерних сообщений с тёплыми словами.','Общих вечеров за фильмом или игрой.','Того, что он приносит вам что-то вкусное, цветы или просто то, чего вам хотелось.','Того, что он решает бытовые вопросы, пока вы заняты другим.','Того, как он обнимает вас, когда проходит мимо.']],
['Что вы заметите первым, если партнёр начнёт отдаляться?',['Он перестал говорить вам тёплые слова и хвалить вас.','Он всё реже находит время побыть с вами вдвоём.','Он перестал дарить вам что-то, хотя раньше вспоминал о поводах.','Он перестал замечать, когда вам нужна помощь.','Он реже проявляет желание близости с вами.']],
['Выходные вдвоём прошли приятно, но вам кажется, что чего-то не хватило. Чего именно?',['Слов о том, как партнёру хорошо с вами.','Общего занятия, которое увлекло бы вас обоих.','Сюрприза, которого вы не ожидали.','Того, что партнёр сам занялся бы всеми хлопотами, а вы просто отдыхали.','Танцев или объятий, когда вы прижимаетесь друг к другу.']],
['Вы переживаете трудный период: проблемы на работе или в семье. Что вам нужно от партнёра больше всего?',['Слов о том, что всё будет хорошо и он на вашей стороне.','Чтобы он оставался с вами вечер за вечером, не торопясь.','Знака, пусть небольшого, что он о вас заботится.','Чтобы он разгрузил вас в делах и заботах.','Чтобы он обнимал вас и держал за руку, когда вам плохо.']],
['Приближается годовщина ваших отношений. Что сильнее всего покажет, что она важна для партнёра?',['Он пишет речь или тост о том, что вы значите для него за эти годы.','Он планирует время, посвящённое только вам двоим.','Он дарит вам вещь, о которой вы мечтали, но не покупали себе сами.','Он сам занимается всеми приготовлениями, пока вы ни о чём не заботитесь.','Праздничный вечер заканчивается физической близостью.']],
['Вы вдвоём в отпуске. Что сильнее всего даст вам ощущение, что вас любят?',['Он часто говорит, что счастлив быть с вами.','Все дни у вас общие занятия, и вы почти не расстаётесь.','Он привозит вам памятный подарок из места, где вы отдыхаете.','Он следит за бронированием, дорогой и расписанием поездки.','Вы почти везде ходите за руку или обнявшись.']]
];
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const $=document.getElementById('a');
let i=-1,A=Q.map(()=>[0,0,0,0,0]);
const O=Q.map(()=>sh([0,1,2,3,4]));
const sum=a=>a.reduce((x,y)=>x+y,0);
function start(){$.innerHTML='<h1>Пять языков любви</h1><p>Здесь 15 ситуаций из жизни пары. В каждой нужно распределить 10 баллов между пятью утверждениями: чем лучше утверждение вам подходит, тем больше баллов. Верных и неверных ответов нет. Можно дать все 10 баллов одному утверждению или разделить их как угодно.</p><div class="nav"><button class="p" id="s">Начать</button></div>'}
function q(){const r=10-sum(A[i]);
$.innerHTML='<p class="m">Вопрос '+(i+1)+' из '+Q.length+'</p><h2>'+Q[i][0]+'</h2><p class="m">Осталось баллов: <b>'+r+'</b></p>'
+O[i].map(k=>'<div class="row"><span>'+Q[i][1][k]+'</span><span class="c"><button data-k="'+k+'" data-d="-1" aria-label="Меньше">−</button><b>'+A[i][k]+'</b><button data-k="'+k+'" data-d="1" aria-label="Больше">+</button></span></div>').join('')
+'<div class="nav"><button data-n="-1"'+(i?'':' disabled')+'>Назад</button><button class="p" data-n="1"'+(r?' disabled':'')+'>'+(i<Q.length-1?'Дальше':'Завершить')+'</button></div>';
window.scrollTo(0,0)}
function code(){const f=A.flat();return 'L1-'+f.map(v=>v==10?'a':v).join('')+'-'+String(f.reduce((x,v,k)=>x+v*(k+1),0)%97).padStart(2,'0')}
function fin(){$.innerHTML='<h2>Готово</h2><p>Скопируйте код и отправьте его тому, кто просил вас пройти опросник.</p><textarea id="t" readonly rows="3">'+code()+'</textarea><div class="nav"><button class="p" id="cp">Скопировать код</button></div><p class="m" id="cm"></p><hr><p class="m">Результат скрыт. Если вы проходите опросник для проверки, не открывайте его, пока вас об этом не попросят.</p><button id="sh">Показать результат</button>';window.scrollTo(0,0)}
async function cp(){const t=document.getElementById('t');t.select();let ok=false;
try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
document.getElementById('cm').textContent=ok?'Код скопирован.':'Автоматически скопировать не вышло. Код выделен, скопируйте его вручную.'}
function res(){const S=[0,1,2,3,4].map(k=>A.reduce((x,a)=>x+a[k],0));const R=[0,1,2,3,4].sort((a,b)=>S[b]-S[a]);
$.innerHTML='<h2>Ваш результат</h2>'+R.map((k,n)=>'<div class="card"><b>'+(n+1)+'. '+L[k]+'</b> — '+Math.round(S[k]/1.5)+'%<div class="bar"><i style="width:'+(S[k]/1.5)+'%"></i></div><p>'+D[k]+'</p></div>').join('')
+'<p class="m">Результат относительный: баллы делились между пятью языками, поэтому он показывает порядок ваших приоритетов, но не силу каждого языка и не годится для сравнения людей между собой. Опросник экспериментальный и пока не проверен на достаточном числе людей. Если у двух языков доли близки, они для вас примерно равны, а не один «главнее».</p>';window.scrollTo(0,0)}
$.onclick=e=>{const t=e.target.closest('button');if(!t||t.disabled)return;
if(t.id=='s'){i=0;q()}
else if(t.dataset.d){const a=A[i],k=+t.dataset.k,d=+t.dataset.d,r=10-sum(a);if((d>0&&r>0)||(d<0&&a[k]>0)){a[k]+=d;q()}}
else if(t.dataset.n){i+=+t.dataset.n;i<Q.length?q():fin()}
else if(t.id=='cp')cp();
else if(t.id=='sh')res()};
start();
</script>
</body>
</html>
